name: PR 58 review fixes

on:
  push:
    branches:
      - codex/fdm-756-global-media-search
    paths:
      - .github/workflows/pr58-review-fixes.yml

permissions:
  contents: write

concurrency:
  group: pr58-review-fixes
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: dashboard-app/package-lock.json
      - name: Apply exact review fixes
        shell: bash
        run: |
          cat > /tmp/patch_pr58.py <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent, indent
          
          
          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 1:
                  file.write_text(text.replace(old, new, 1), encoding='utf-8')
                  return
              if count > 1 or '\n' not in old:
                  raise RuntimeError(f'{path}: expected one match, found {count}: {old[:120]!r}')
          
              old_code = dedent(old).strip('\n')
              new_code = dedent(new).strip('\n')
              first_line = old_code.splitlines()[0]
              matches = []
              for match in re.finditer(rf'(?m)^([ \t]*){re.escape(first_line)}', text):
                  prefix = match.group(1)
                  candidate = indent(old_code, prefix)
                  if text.startswith(candidate, match.start()):
                      matches.append((match.start(), prefix, candidate))
              if len(matches) != 1:
                  raise RuntimeError(
                      f'{path}: expected one indented match, found {len(matches)}: {first_line!r}'
                  )
              start, prefix, candidate = matches[0]
              replacement = indent(new_code, prefix)
              file.write_text(text[:start] + replacement + text[start + len(candidate):], encoding='utf-8')
          
          
          def insert_before(path: str, anchor: str, content: str) -> None:
              anchor_body = anchor.lstrip('\n')
              first_line = anchor_body.splitlines()[0]
              prefix = first_line[: len(first_line) - len(first_line.lstrip())]
              rendered = indent(dedent(content).strip('\n'), prefix)
              leading = '\n' if anchor.startswith('\n') else ''
              replace_once(path, anchor, leading + rendered + '\n\n' + anchor_body)
          
          
          # 1. Replace per-card Jellyseerr detail fan-out with a bounded active-request list lookup.
          discover_path = 'config/homepage-actions/routes/discover.py'
          insert_before(
              discover_path,
              '\ndef _decorate_discover_lifecycle(items, *, library=None):\n',
              dedent('''
          
              _JELLYSEERR_ACTIVE_REQUEST_PAGE_SIZE = 100
              _JELLYSEERR_ACTIVE_REQUEST_MAX_PAGES = 3
          
          
              def _jellyseerr_active_request_snapshot(identities, *, fetch=_jellyseerr_get):
                  """Read active request state with a bounded number of list requests."""
                  requested = {
                      identity
                      for item_type, tmdb_id in identities or ()
                      for identity in [media_state._typed_identity(item_type, tmdb_id)]
                      if identity
                  }
                  if not requested:
                      return media_state.JellyseerrRequestSnapshot({}, {})
          
                  states = {}
                  complete = False
                  for page_index in range(_JELLYSEERR_ACTIVE_REQUEST_MAX_PAGES):
                      skip = page_index * _JELLYSEERR_ACTIVE_REQUEST_PAGE_SIZE
                      payload = fetch(
                          "/api/v1/request"
                          f"?take={_JELLYSEERR_ACTIVE_REQUEST_PAGE_SIZE}"
                          f"&skip={skip}&filter=unavailable&sort=modified&sortDirection=desc"
                      )
                      if not isinstance(payload, dict) or not isinstance(payload.get("results"), list):
                          raise ValueError("invalid Jellyseerr request list")
                      rows = payload["results"]
                      for row in rows:
                          if not isinstance(row, dict) or row.get("is4k") is True:
                              continue
                          media = row.get("media") or {}
                          if not isinstance(media, dict):
                              media = {}
                          identity = media_state._typed_identity(
                              row.get("type") or media.get("mediaType"),
                              media.get("tmdbId") or row.get("tmdbId"),
                          )
                          status = media_state._normalized_request_status(row.get("status"))
                          if identity not in requested or not status:
                              continue
                          candidate = {
                              "status": status,
                              "request_id": media_state._positive_int(row.get("id")),
                          }
                          current = states.get(identity)
                          if current is None or (
                              current.get("status") == "processing" and status == "requested"
                          ):
                              states[identity] = candidate
          
                      if requested.issubset(states):
                          complete = True
                          break
                      page_info = payload.get("pageInfo") or {}
                      if not isinstance(page_info, dict):
                          page_info = {}
                      page_count = media_state._positive_int(page_info.get("pages"))
                      if page_count is not None:
                          if page_index + 1 >= page_count:
                              complete = True
                              break
                      elif len(rows) < _JELLYSEERR_ACTIVE_REQUEST_PAGE_SIZE:
                          complete = True
                          break
          
                  return media_state.JellyseerrRequestSnapshot(
                      states=states,
                      sources={
                          identity: "fresh" if complete or identity in states else "unavailable"
                          for identity in requested
                      },
                  )
              '''),
          )
          replace_once(
              discover_path,
              '        requests = media_state.get_jellyseerr_request_snapshot(identities)\n',
              '        requests = _jellyseerr_active_request_snapshot(identities)\n',
