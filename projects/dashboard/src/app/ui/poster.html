<div class="mm-poster">
  <div class="mm-poster__art" [style.background]="art()">
    <div class="mm-poster__overlay">
      <div class="mm-poster__head">
        <strong>{{ title() }}</strong>
        @if (rating() !== null) {
          <span class="mm-poster__rating" aria-label="Rating {{ rating() }} out of 10">★ {{ rating() }}</span>
        }
      </div>
      <small>{{ meta() }}</small>
    </div>
  </div>
</div>
