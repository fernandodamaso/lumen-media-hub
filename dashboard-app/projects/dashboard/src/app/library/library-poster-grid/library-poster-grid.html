<div
  class="poster-rail"
  [class.poster-rail--carousel]="canCarousel()"
  data-testid="library-poster-grid"
>
  <div class="poster-rail__stage">
    @if (canCarousel()) {
      <div class="poster-rail__nav-layer">
        <button
          type="button"
          class="poster-rail__nav poster-rail__nav--prev"
          aria-label="Previous posters"
          [disabled]="page() === 0"
          (click)="prevPage()"
        >
          <svg lucideChevronLeft [size]="18" aria-hidden="true"></svg>
        </button>
        <button
          type="button"
          class="poster-rail__nav poster-rail__nav--next"
          aria-label="Next posters"
          [disabled]="page() >= pageCount() - 1"
          (click)="nextPage()"
        >
          <svg lucideChevronRight [size]="18" aria-hidden="true"></svg>
        </button>
      </div>
    }

    <div
      class="posters"
      [class.posters--compact]="compact()"
      [class.posters--page]="!compact()"
      [attr.aria-live]="canCarousel() ? 'polite' : null"
    >
      @for (item of visibleItems(); track item.id) {
        @let href = playHref(item);
        <mm-poster
          [title]="item.title"
          [meta]="item.meta || kindLabel(item.kind)"
          [imageUrl]="posterImageSrc(item)"
          [art]="posterFallbackArt(item)"
          captionPlacement="below"
          [href]="href"
          [linkLabel]="href ? 'Play ' + item.title : null"
          [showPlayCue]="!!href"
          [retryToken]="artNonce()"
        />
      }
    </div>
  </div>
</div>
