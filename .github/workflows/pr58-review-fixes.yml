                      self.assertEqual(snapshot.get("tv", 1), {"status": "processing", "request_id": 91})
                      self.assertEqual(snapshot.status("movie", 25), "fresh")
          
                  def test_active_request_lookup_fails_closed_after_the_page_cap(self):
