services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    networks:
      - media-net
    ports:
      - "${JELLYFIN_BIND_ADDRESS:?JELLYFIN_BIND_ADDRESS must be set}:${JELLYFIN_PORT}:8096"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
    volumes:
      - ${ROOT_PATH}:/data
      - ./config/jellyfin:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    networks:
      - media-net
    ports:
      - "${MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}"
      - "${QBITTORRENT_PEER_PORT}:${QBITTORRENT_PEER_PORT}/tcp"
      - "${QBITTORRENT_PEER_PORT}:${QBITTORRENT_PEER_PORT}/udp"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
      - TORRENTING_PORT=${QBITTORRENT_PEER_PORT}
    volumes:
      - ${ROOT_PATH}:/data
      - ${DOWNLOADS_PATH}:/downloads
      - ./config/qbittorrent:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    networks:
      - media-net
    ports:
      - "${MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${RADARR_PORT}:7878"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
    volumes:
      - ${ROOT_PATH}:/data
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
      - ./config/radarr:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    networks:
      - media-net
    ports:
      - "${MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${SONARR_PORT}:8989"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
    volumes:
      - ${ROOT_PATH}:/data
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
      - ./config/sonarr:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    networks:
      - media-net
    ports:
      - "${MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${PROWLARR_PORT}:9696"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
    volumes:
      - ./config/prowlarr:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    profiles:
      - indexer-tools
    restart: unless-stopped
    networks:
      - media-net
    ports:
      - "${MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${FLARESOLVERR_PORT}:8191"
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      - CAPTCHA_SOLVER=${FLARESOLVERR_CAPTCHA_SOLVER:-none}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    profiles:
      - subtitles
    restart: unless-stopped
    networks:
      - media-net
    ports:
      - "${MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${BAZARR_PORT}:6767"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
    volumes:
      - ${ROOT_PATH}:/data
      - ./config/bazarr:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    profiles:
      - requests
    restart: unless-stopped
    networks:
      - media-net
    ports:
      - "${MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${JELLYSEERR_PORT:-5055}:5055"
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
    volumes:
      - ./config/jellyseerr:/app/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  unpackerr:
    image: ghcr.io/unpackerr/unpackerr:latest
    container_name: unpackerr
    profiles:
      - maintenance
    restart: unless-stopped
    networks:
      - media-net
    volumes:
      - ${ROOT_PATH}:/data
      - ./config/unpackerr:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    profiles:
      - maintenance
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    networks:
      - media-net
    volumes:
      - ./config/recyclarr:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: maintainerr
    profiles:
      - maintenance
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    networks:
      - media-net
    ports:
      - "${MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${MAINTAINERR_PORT:-6246}:6246"
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/maintainerr:/opt/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  homepage-actions:
    image: python:3.13-alpine
    container_name: homepage-actions
    restart: unless-stopped
    networks:
      - media-net
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      - TZ=${TZ}
      - QBT_URL=http://qbittorrent:${QBITTORRENT_WEBUI_PORT}
      - QBT_USERNAME=admin
      - QBT_PASSWORD=${QBT_PASSWORD:?QBT_PASSWORD must be set}
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_EXTERNAL_URL=http://${PUBLIC_HOST:-127.0.0.1}:${JELLYFIN_PORT}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - SONARR_URL=http://sonarr:8989
      - SONARR_EXTERNAL_URL=http://${PUBLIC_HOST:-127.0.0.1}:${SONARR_PORT}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_URL=http://radarr:7878
      - RADARR_EXTERNAL_URL=http://${PUBLIC_HOST:-127.0.0.1}:${RADARR_PORT}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - PROWLARR_URL=http://prowlarr:9696
      - PROWLARR_EXTERNAL_URL=http://${PUBLIC_HOST:-127.0.0.1}:${PROWLARR_PORT}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
      - BAZARR_URL=http://bazarr:6767
      - BAZARR_EXTERNAL_URL=http://${PUBLIC_HOST:-127.0.0.1}:${BAZARR_PORT}
      - BAZARR_ENABLED=${BAZARR_ENABLED:-false}
      - BAZARR_API_KEY=${BAZARR_API_KEY}
      - QBITTORRENT_EXTERNAL_URL=http://${PUBLIC_HOST:-127.0.0.1}:${QBITTORRENT_WEBUI_PORT}
      - JELLYSEERR_URL=http://jellyseerr:5055
      - JELLYSEERR_ENABLED=${JELLYSEERR_ENABLED:-false}
      - JELLYSEERR_API_KEY=${JELLYSEERR_API_KEY}
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID}
      - TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET}
      - TRAKT_TOKEN_PATH=${TRAKT_TOKEN_PATH:-/state/trakt-token.json}
      - TRAKT_WATCHED_PATH=${TRAKT_WATCHED_PATH:-/state/trakt-watched.json}
      - RECOMMENDATIONS_PATH=/recommendations/recommendations.json
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_PICKS_TARGET_ACTIVE=${AI_PICKS_TARGET_ACTIVE:-20}
      - AI_PICKS_ON_DEMAND_COUNT=${AI_PICKS_ON_DEMAND_COUNT:-10}
      - AI_PICKS_LEASE_SECONDS=${AI_PICKS_LEASE_SECONDS:-300}
      - AI_PICKS_SCHEDULE_HOUR=${AI_PICKS_SCHEDULE_HOUR:-10}
      - AI_PICKS_COLLECTION_NAME=${AI_PICKS_COLLECTION_NAME:-AI Picks}
      - CORS_ORIGINS=http://${PUBLIC_HOST:-127.0.0.1}:${DASHBOARD_PORT:-3000},http://localhost:3000,http://127.0.0.1:3000,http://localhost:4200,http://127.0.0.1:4200
      - ACTIONS_TOKEN=${ACTIONS_TOKEN:?ACTIONS_TOKEN must be set}
      - PORT=8085
      - DATA_PATH=/data
      - QUEUE_HYGIENE_MODE=${QUEUE_HYGIENE_MODE:-observe}
      - QUEUE_HYGIENE_INTERVAL_SECONDS=${QUEUE_HYGIENE_INTERVAL_SECONDS:-300}
      - QUEUE_HYGIENE_GRACE_SECONDS=${QUEUE_HYGIENE_GRACE_SECONDS:-21600}
      - QUEUE_HYGIENE_STATE_PATH=${QUEUE_HYGIENE_STATE_PATH:-/recommendations/queue-hygiene-state.json}
    volumes:
      - ./config/homepage-actions:/app:ro
      - ./config/recommendations:/recommendations
      - ${TRAKT_STATE_PATH:-./.state/trakt}:/state
      - ${ROOT_PATH}:/data:ro
    working_dir: /app
    command: python main.py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ai-recommendations:
    profiles: ["ai"]
    build:
      context: ./config/ai-recommendations
    image: media-ai-recommendations:local
    container_name: ai-recommendations
    restart: unless-stopped
    networks:
      - media-net
    environment:
      - PORT=8090
      - HOMEPAGE_ACTIONS_URL=http://homepage-actions:8085
      - ACTIONS_TOKEN=${ACTIONS_TOKEN:?ACTIONS_TOKEN must be set}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_POLL_INTERVAL_MS=${AI_POLL_INTERVAL_MS:-2000}
      - AI_MODEL_TIMEOUT_MS=${AI_MODEL_TIMEOUT_MS:-60000}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY:-}
      - AI_COMPATIBLE_BASE_URL=${AI_COMPATIBLE_BASE_URL:-}
      - AI_COMPATIBLE_API_KEY=${AI_COMPATIBLE_API_KEY:-}
      - AI_COMPATIBLE_SUPPORTS_STRUCTURED_OUTPUTS=${AI_COMPATIBLE_SUPPORTS_STRUCTURED_OUTPUTS:-false}
    depends_on:
      - homepage-actions
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build:
      context: ./dashboard-app
    image: media-dashboard-angular:local
    container_name: dashboard
    restart: unless-stopped
    networks:
      - media-net
    ports:
      - "${MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-3000}:80"
    environment:
      - ACTIONS_TOKEN=${ACTIONS_TOKEN:?ACTIONS_TOKEN must be set}
    depends_on:
      - homepage-actions
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  media-net:
    driver: bridge
