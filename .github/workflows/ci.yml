name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: dashboard-app/package-lock.json
      - run: npm ci
      - run: npm run quality
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npm run build:storybook
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run assembled app smoke tests
        run: npm run test:smoke
      - name: Serve Storybook and run interaction/a11y tests
        run: npm run test:storybook

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config/homepage-actions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m compileall .
      - run: python -m unittest discover -v
