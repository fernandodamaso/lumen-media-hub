<h1 class="sr-only">Dashboard</h1>

<mm-dashboard-header
  [syncedAt]="syncedAt()"
  (requestMedia)="onRequestMedia()"
  (openJellyfin)="onOpenJellyfin()"
  (refresh)="onRefresh()"
  (searchQuery)="onSearch($event)"
/>

<div class="metrics-row">
  <mm-metric-card
    iconName="folder"
    tone="premiere"
    label="Library"
    [value]="libraryTotal()"
    [meta]="libraryMeta()"
    [href]="jellyfinLibraryHref()"
    [external]="true"
  />
  <mm-metric-card
    iconName="download"
    tone="info"
    label="Downloads"
    [value]="downloads.summary().active"
    [meta]="downloadsMeta()"
    href="#downloads-region"
  />
  <mm-metric-card
    iconName="activity"
    tone="success"
    label="Services"
    [value]="servicesValue()"
    [meta]="servicesStatus()"
    href="#service-health-region"
  />
  <mm-metric-card
    iconName="hard-drive"
    tone="warning"
    label="Storage"
    [value]="storagePercent() + '%'"
    [meta]="storageMeta()"
    [progress]="storagePercent()"
    href="#storage-region"
  />
</div>

@if (libraryNotice()) {
  <p class="metrics-notice" role="status" aria-live="polite">{{ libraryNotice() }}</p>
}

@if (hasAttention()) {
  <mm-attention-banner
    [headline]="attentionHeadline()"
    [message]="attentionMessage()"
  />
}

<div class="home-grid" data-testid="home-grid">
  <div class="home-grid__col home-grid__col--main">
    <div class="home-grid__downloads region" id="downloads-region" data-region="downloads">
      <mm-downloads-board />
    </div>
    <div class="home-grid__runs region" id="runs-region" data-region="runs">
      <mm-automation-runs-card />
    </div>
  </div>
  <div class="home-grid__col home-grid__col--side">
    <div class="home-grid__health region" id="service-health-region" data-region="service-health">
      <mm-service-health-card />
    </div>
    <div class="home-grid__storage region" id="storage-region" data-region="storage">
      <mm-storage-card />
    </div>
  </div>
  <div class="home-grid__col home-grid__col--calendar">
    <div class="home-grid__calendar region" id="calendar-region" data-region="calendar">
      <mm-calendar-board />
    </div>
  </div>
</div>
