<div class="mm-poster" [class.mm-poster--unframed]="!framed()">
  <div class="mm-poster__art" [style.background]="showNetworkImage() ? null : art()">
    @if (showNetworkImage()) {
      <img
        class="mm-poster__image"
        [src]="imageUrl()!"
        alt=""
        loading="lazy"
        decoding="async"
        (error)="onImageError()"
      />
    }
    @if (tag()) {
      <span
        class="mm-poster__tag"
        [class.mm-poster__tag--success]="tagTone() === 'success'"
      >{{ tag() }}</span>
    }
    <div class="mm-poster__overlay">
      @if (episode()) {
        <div class="mm-poster__episode">{{ episode() }}</div>
      }
      <div class="mm-poster__head">
        <strong>{{ title() }}</strong>
        @if (rating() !== null && rating() !== undefined) {
          <span class="mm-poster__rating" aria-label="Rating {{ rating() }} out of 10">★ {{ rating() }}</span>
        }
      </div>
      <small>{{ meta() }}</small>
    </div>
    @if (progress() !== null && progress() !== undefined) {
      <div class="mm-poster__progress" aria-hidden="true">
        <div class="mm-poster__progress-bar" [style.width.%]="progress()"></div>
      </div>
    }
  </div>
</div>
