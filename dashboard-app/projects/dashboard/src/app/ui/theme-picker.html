<div class="theme-switch" role="group" aria-label="Choose theme">
  @for (theme of themes; track theme) {
    <button
      type="button"
      [class.is-active]="themeService.theme() === theme"
      [attr.aria-pressed]="themeService.theme() === theme"
      [attr.title]="labels[theme]"
      (click)="select(theme)"
    >
      {{ shortLabels[theme] }}
    </button>
  }
</div>
@if (justSaved()) {
  <span class="theme-switch__saved sr-only" aria-live="polite">Theme saved</span>
}
