<div
  #posterRail
  class="poster-rail"
  [class.poster-rail--carousel]="canCarousel()"
  data-testid="watch-next-grid"
>
  <div class="poster-rail__stage">
    @if (canCarousel()) {
      <div class="poster-rail__nav-layer">
        <button
          type="button"
          class="poster-rail__nav poster-rail__nav--prev"
          aria-label="Previous posters"
          [disabled]="page() === 0"
          (click)="prevPage()"
        >
          <svg lucideChevronLeft [size]="18" aria-hidden="true"></svg>
        </button>
        <button
          type="button"
          class="poster-rail__nav poster-rail__nav--next"
          aria-label="Next posters"
          [disabled]="page() >= pageCount() - 1"
          (click)="nextPage()"
        >
          <svg lucideChevronRight [size]="18" aria-hidden="true"></svg>
        </button>
      </div>
    }

    <div
      class="posters"
      [class.posters--compact]="compact()"
      [class.posters--page]="!compact()"
      [attr.aria-live]="canCarousel() ? 'polite' : null"
    >
      @for (item of visibleItems(); track item.id) {
        <figure class="poster">
          <div class="poster__frame" [class.poster__frame--playable]="!!playHref(item)" [style.background]="artStyle(item)">
            @if (playHref(item); as href) {
              <a
                class="poster__hit"
                [href]="href"
                target="_blank"
                rel="noreferrer"
                [attr.aria-label]="'Play ' + item.title"
              ></a>
            }
            @if (posterImageSrc(item); as src) {
              <img
                class="poster__image"
                [src]="src"
                alt=""
                loading="lazy"
                (error)="onArtError(item)"
              />
            }
            <div class="poster__progress">
              @if (showProgress(item)) {
                <mm-progress
                  tone="accent"
                  [value]="item.progressPercent"
                  [showLabel]="false"
                  [label]="progressLabel(item)"
                />
              }
            </div>
            <div class="poster__actions" aria-hidden="true">
              @if (playHref(item)) {
                <span class="poster__action">
                  <svg lucidePlay [size]="14" aria-hidden="true"></svg>
                </span>
              }
            </div>
          </div>
          <figcaption>
            @if (playHref(item); as href) {
              <a
                class="poster__title poster__title--link"
                [href]="href"
                target="_blank"
                rel="noreferrer"
                [attr.aria-label]="'Play ' + item.title"
              >{{ item.title }}</a>
            } @else {
              <span class="poster__title">{{ item.title }}</span>
            }
            @if (item.subtitle) {
              <span class="poster__meta">{{ item.subtitle }}</span>
            }
          </figcaption>
        </figure>
      }
    </div>
  </div>
</div>
