<a class="skip-link" href="#main-content">Skip to main content</a>
<div class="shell">
  <div class="shell-body">
    <nav class="sidebar" aria-label="Primary navigation">
      <div class="sidebar__header">
        <a class="brand" routerLink="/" aria-label="Media Manager home">
          <span class="brand-mark" aria-hidden="true">M</span>
          <span class="brand__text">Media Manager</span>
        </a>
        <span class="demo-badge" [attr.aria-label]="modeLabel + ' mode'">{{ modeLabel }}</span>
      </div>
      <div class="sidebar__nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <svg lucideLayoutDashboard [size]="18" aria-hidden="true"></svg>
          <span>Dashboard</span>
        </a>
        <a routerLink="/reports" routerLinkActive="active">
          <svg lucideFileText [size]="18" aria-hidden="true"></svg>
          <span>Reports</span>
        </a>
        <a routerLink="/discover" routerLinkActive="active">
          <svg lucideCompass [size]="18" aria-hidden="true"></svg>
          <span>Discover</span>
        </a>
      </div>
      <div class="sidebar__footer">
        <mm-theme-picker />
      </div>
    </nav>

    <main id="main-content" class="content">
      <router-outlet />
    </main>
  </div>
</div>
