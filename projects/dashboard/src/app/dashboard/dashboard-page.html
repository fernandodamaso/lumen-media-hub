<header class="pagehead">
  <div>
    <h1>Dashboard</h1>
    <p class="pagehead__sub">
      {{ pageheadDate() }} ·
      <span class="pagehead__accent">{{ downloadsMeta() }}</span>
    </p>
  </div>
  <div class="pagehead__actions">
    <mm-button label="Add media" icon="plus" (click)="onAddMedia()" />
  </div>
</header>

<div class="metrics-row">
  <mm-metric-card
    iconName="folder"
    tone="premiere"
    label="Library"
    [value]="libraryTotal()"
    [meta]="libraryMeta()"
    [href]="jellyfinLibraryHref()"
    [external]="true"
  />
  <mm-metric-card
    iconName="download"
    tone="info"
    label="Downloads"
    [value]="downloads.summary().active"
    [meta]="downloadsMeta()"
    href="#downloads-region"
  />
  <mm-metric-card
    iconName="activity"
    tone="success"
    label="Services"
    [value]="servicesValue()"
    [meta]="servicesStatus()"
    href="#automation-region"
  />
  <mm-metric-card
    iconName="hard-drive"
    tone="warning"
    label="Storage"
    [value]="storagePercent() + '%'"
    [meta]="storageMeta()"
    [progress]="storagePercent()"
    href="#automation-region"
  />
</div>

@if (libraryNotice()) {
  <p class="metrics-notice" role="status" aria-live="polite">{{ libraryNotice() }}</p>
}

<div class="dashboard-grid" data-testid="dashboard-grid">
  <div class="dashboard-grid__cell dashboard-grid__cell--library region" data-region="library">
    <mm-library-card />
  </div>
  <div class="dashboard-grid__cell dashboard-grid__cell--upcoming region" id="upcoming-region" data-region="upcoming">
    <mm-upcoming-card />
  </div>
  <div class="dashboard-grid__cell dashboard-grid__cell--downloads region" id="downloads-region" data-region="downloads">
    <mm-downloads-card />
  </div>
  <div class="dashboard-grid__cell dashboard-grid__cell--automation region" id="automation-region" data-region="automation">
    <mm-automation-card />
  </div>
</div>
