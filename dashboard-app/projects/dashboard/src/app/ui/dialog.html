<!-- Backdrop click-to-close; Escape is handled natively by <dialog>. -->
<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
<dialog
  #dialogEl
  class="mm-dialog"
  [attr.id]="dialogId"
  [attr.aria-labelledby]="showHeader() ? titleId : null"
  [attr.aria-label]="title()"
  (click)="onDialogClick($event)"
  (keydown)="onDialogKeydown($event)"
  (close)="onNativeClose()"
>
  @if (showHeader()) {
  <header class="mm-dialog__head">
    <h2 [id]="titleId" class="mm-dialog__title">
      @if (tone() !== 'default') {
        <span
          class="mm-dialog__dot"
          [class.mm-dialog__dot--warning]="tone() === 'warning'"
          [class.mm-dialog__dot--danger]="tone() === 'danger'"
          aria-hidden="true"
        ></span>
      }
      {{ title() }}
    </h2>
    <button type="button" class="mm-dialog__close" aria-label="Close" (click)="close()">
      <svg lucideX [size]="16" [strokeWidth]="2.2" aria-hidden="true"></svg>
    </button>
  </header>
  }
  <div class="mm-dialog__body">
    <ng-content />
  </div>
  <footer class="mm-dialog__foot">
    <ng-content select="[mmDialogFooter]" />
  </footer>
</dialog>
<!-- eslint-enable @angular-eslint/template/interactive-supports-focus -->
