<div
  class="poster-rail"
  [class.poster-rail--carousel]="canCarousel()"
  data-testid="library-poster-grid"
>
  <div class="poster-rail__stage">
    @if (canCarousel()) {
      <div class="poster-rail__nav-layer">
        <button
          type="button"
          class="poster-rail__nav poster-rail__nav--prev"
          aria-label="Previous posters"
          [disabled]="page() === 0"
          (click)="prevPage()"
        >
          <svg lucideChevronLeft [size]="18" aria-hidden="true"></svg>
        </button>
        <button
          type="button"
          class="poster-rail__nav poster-rail__nav--next"
          aria-label="Next posters"
          [disabled]="page() >= pageCount() - 1"
          (click)="nextPage()"
        >
          <svg lucideChevronRight [size]="18" aria-hidden="true"></svg>
        </button>
      </div>
    }

    <div
      class="posters"
      [class.posters--compact]="compact()"
      [class.posters--page]="!compact()"
      [attr.aria-live]="canCarousel() ? 'polite' : null"
    >
      @for (item of visibleItems(); track item.id) {
        <figure class="poster">
          <div class="poster__frame" [style.background]="artStyle(item)">
            @if (posterImageSrc(item); as src) {
              <img
                class="poster__image"
                [src]="src"
                alt=""
                loading="lazy"
                (error)="onArtError(item)"
              />
            }
            <div class="poster__actions">
              @if (playHref(item); as href) {
                <mm-tooltip text="Play" tone="accent">
                  <a
                    class="poster__action"
                    [href]="href"
                    target="_blank"
                    rel="noreferrer"
                    [attr.aria-label]="'Play ' + item.title"
                  >
                    <svg lucidePlay [size]="14" aria-hidden="true"></svg>
                  </a>
                </mm-tooltip>
              }
            </div>
          </div>
          <figcaption>
            @if (playHref(item); as href) {
              <a
                class="poster__title poster__title--link"
                [href]="href"
                target="_blank"
                rel="noreferrer"
                [attr.aria-label]="'Play ' + item.title"
              >{{ item.title }}</a>
            } @else {
              <span class="poster__title">{{ item.title }}</span>
            }
            <span class="poster__meta">{{ item.meta || kindLabel(item.kind) }}</span>
          </figcaption>
        </figure>
      }
    </div>
  </div>
</div>
