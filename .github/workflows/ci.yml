name: CI

on:
  push:
  pull_request:

jobs:
  workflow-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.ps1 defines Assert-Docker
        run: grep -q 'function Assert-Docker' install.ps1
      - name: pre-commit cds into dashboard-app before quality
        run: |
          grep -q 'cd "$(git rev-parse --show-toplevel)/dashboard-app"' dashboard-app/githooks/pre-commit
          grep -q 'npm run quality' dashboard-app/githooks/pre-commit
      - name: compose wires QBT_PASSWORD from env
        run: grep -q 'QBT_PASSWORD=\${QBT_PASSWORD' docker-compose.yml
      - name: Validate Compose configurations
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          docker compose --env-file .env.example -f docker-compose.yml \
            config --format json \
          | python3 -c '
          import json, sys
          services = set(json.load(sys.stdin)["services"])
          expected = {"jellyfin", "qbittorrent", "sonarr", "radarr", "prowlarr", "homepage-actions", "dashboard"}
          assert services == expected, services
          print("core services ok:", sorted(services))
          '
          docker compose --env-file .env.example \
            --profile subtitles --profile requests --profile maintenance --profile indexer-tools \
            -f docker-compose.yml config --quiet
          docker compose --env-file .env.example \
            --profile subtitles --profile requests --profile maintenance --profile indexer-tools \
            -f docker-compose.yml config --format json \
          | python3 -c '
          import json, sys
          services = set(json.load(sys.stdin)["services"])
          expected = {"jellyfin", "qbittorrent", "sonarr", "radarr", "prowlarr", "flaresolverr", "bazarr", "jellyseerr", "unpackerr", "recyclarr", "maintainerr", "homepage-actions", "dashboard"}
          assert services == expected, services
          assert "dashboard-react" not in services
          print("all supported profiles ok:", sorted(services))
          '
          docker compose --env-file .env.example \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            config --quiet
      - name: Dev override replaces dashboard host port mapping
        run: |
          docker compose --env-file .env.example \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            config --format json \
          | python3 -c '
          import json, sys
          ports = json.load(sys.stdin)["services"]["dashboard"]["ports"]
          assert len(ports) == 1, ports
          assert str(ports[0]["published"]) == "3000", ports
          assert str(ports[0]["target"]) == "4200", ports
          print("dashboard ports ok:", ports)
          '

  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: dashboard-app/package-lock.json
      - run: npm ci
      - run: npm run quality
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npm run build:storybook
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run assembled app smoke tests
        run: npm run test:smoke
      - name: Serve Storybook and run interaction/a11y tests
        run: npm run test:storybook

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config/homepage-actions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m compileall .
      - run: python -m unittest discover -v
